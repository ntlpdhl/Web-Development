<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinobi File | Bingo Book</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/Bingo_Book.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid hero py-4 border-bottom border-warning border-4 shadow fixed-top">
    <div class="container d-flex justify-content-between align-items-center">
      <h2 class="text-warning title-font m-0">Bingo Book File</h2>
      <a href="index.html" id="backlink" class="btn btn-outline-warning rounded-pill px-4">Back to Registry</a>
    </div>
  </div>

  <div class="container" style="margin-top: 120px; margin-bottom: 60px;">
    <div class="card border-warning border-2 rounded-4 shadow-lg p-4 p-md-5 bg-body-tertiary" id="content">
      <div class="text-center py-5">
        <div class="spinner-border text-warning" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div class="text-secondary mt-3">Decrypting shinobi file...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const $ = id => document.getElementById(id);
    const API = 'https://graphql.anilist.co';

    const colors = { MAIN: 'warning', SUPPORTING: 'info', BACKGROUND: 'secondary' };
    const label = r => r[0] + r.slice(1).toLowerCase();
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const page = urlParams.get('page');

    if (page != null && $('backlink')) {
      $('backlink').href = "index.html?page=" + page;
    }

    const QUERY = `
      query ($id: Int) {
        Character(id: $id) {
          id
          name { full native }
          image { large }
          description
          gender
          age
          dateOfBirth { month day }
          bloodType
          favourites
        }
      }
    `;

    const getCharacter = async () => {
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ query: QUERY, variables: { id: parseInt(id) } })
        });
        const { data } = await res.json();
        const c = data.Character;
        const d = c.dateOfBirth || {};

        const about = (c.description || '').replace(/~!.*?!~/gs, '').replace(/<br\s*\/?>/g, '\n')
          .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/https?:\/\/\S+/g, '').replace(/__|\*\*|<[^>]+>/g, '').trim();

        const stat = (k, v) => v ? `<div class="col"><div class="bg-body rounded p-3 border border-secondary border-opacity-25 shadow-sm"><div class="text-secondary small" style="font-size:.75rem">${k}</div><div class="fw-bold">${v}</div></div></div>` : '';

        $('content').innerHTML = `
          <div class="row g-4 align-items-center">
            <div class="col-md-4 text-center">
              <img src="${c.image.large}" class="img-fluid rounded-4 shadow border border-warning border-2" alt="">
            </div>
            <div class="col-md-8">
              <span class="badge text-bg-${colors[c.role] || 'warning'} mb-2">Shinobi Profile</span>
              <h1 class="text-warning title-font display-5 mb-0">${c.name.full}</h1>
              <div class="text-secondary fs-5 mb-3">${c.name.native || ''}</div>
              
              <div class="row row-cols-2 row-cols-sm-3 g-2 mb-4">
                ${stat('Gender', c.gender)}
                ${stat('Age', c.age)}
                ${stat('Birthday', d.month && months[d.month - 1] + ' ' + d.day)}
                ${stat('Blood type', c.bloodType)}
                ${stat('Favourites', '♥ ' + c.favourites)}
              </div>
              <p class="small text-secondary" style="white-space: pre-line; line-height: 1.6;">${about || 'No description available.'}</p>
            </div>
          </div>`;
      } catch {
        $('content').innerHTML = '<p class="text-center text-danger p-5">Failed to load shinobi file. Please go back.</p>';
      }
    };

    if (id != null) {
      getCharacter();
    } else {
      $('content').innerHTML = '<p class="text-center text-secondary p-5">No character ID provided.</p>';
    }
  </script>
</body>

</html>
